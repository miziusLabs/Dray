name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the version bump
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate the version
        id: version
        shell: bash
        run: |
          current=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          package_version=$(jq -r .version apps/desktop/package.json)
          cargo_version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' apps/desktop/src-tauri/Cargo.toml | head -1)

          if [[ "$current" != "$package_version" || "$current" != "$cargo_version" ]]; then
            echo "Version mismatch: tauri=$current package=$package_version cargo=$cargo_version" >&2
            exit 1
          fi

          previous=$(git show "${{ github.event.before }}:apps/desktop/src-tauri/tauri.conf.json" 2>/dev/null | jq -r .version || true)
          if [[ "$current" == "$previous" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "The version was not bumped; nothing to release."
            exit 0
          fi

          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $current" >&2
            exit 1
          fi

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "tag=v$current" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.bumped == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: Windows
            platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ${{ matrix.name }}-${{ matrix.rust-targets }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.version }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: ${{ matrix.args }}

  publish:
    name: Publish
    needs: [prepare, build]
    if: needs.prepare.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                ...context.repo,
                per_page: 100,
              },
            );
            const tag = process.env.TAG;
            const release = releases.find(
              ({ tag_name, draft }) => tag_name === tag && draft,
            );

            if (!release) {
              throw new Error(`Draft release not found for tag ${tag}`);
            }

            const previousRelease = releases
              .filter(({ tag_name, draft }) => !draft && tag_name !== tag)
              .sort(
                (a, b) =>
                  Date.parse(b.published_at ?? b.created_at) -
                  Date.parse(a.published_at ?? a.created_at),
              )[0];

            const commits = previousRelease
              ? await github.paginate(github.rest.repos.compareCommits, {
                  ...context.repo,
                  base: previousRelease.tag_name,
                  head: context.sha,
                  per_page: 100,
                })
              : await github.paginate(github.rest.repos.listCommits, {
                  ...context.repo,
                  sha: context.sha,
                  per_page: 100,
                });

            const body = commits
              .map(({ commit, html_url }) => {
                const [title, ...descriptionLines] = commit.message.split(/\r?\n/);
                const description = descriptionLines
                  .join(" ")
                  .replace(/\s+/g, " ")
                  .trim();

                return `- ${title.trim()}; ${description} (${html_url}).`;
              })
              .join("\n");

            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              body,
              draft: false,
            });
