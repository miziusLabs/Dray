name: CI

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/package.json

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(jq -er '.version | strings | select(length > 0)' apps/desktop/src-tauri/tauri.conf.json)"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          changed=false
          previous="$(git show "$BEFORE:apps/desktop/src-tauri/tauri.conf.json" | jq -er '.version')"
          if [ "$version" != "$previous" ]; then
            changed=true
          fi
          if [ "$changed" = true ]; then
            package_version="$(jq -er .version apps/desktop/package.json)"
            cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)"
            if [ "$version" != "$package_version" ] || [ "$version" != "$cargo_version" ]; then
              echo "::error::Desktop version files do not match"
              exit 1
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid desktop version $version"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null &&
               [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already points to a different commit"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - id: channel
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/desktop-setup

      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build Dray Island
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          brew install xcodegen
          apps/island/build.sh apps/desktop/src-tauri/target/island

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: ${{ needs.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generateReleaseNotes: true
          args: --target universal-apple-darwin --features cef --config src-tauri/tauri.cef.conf.json --config src-tauri/tauri.island.conf.json
