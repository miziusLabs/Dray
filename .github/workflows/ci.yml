name: CI

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - name: Check out the version bump
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate the version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(jq -er '.version | strings | select(length > 0)' apps/desktop/src-tauri/tauri.conf.json)"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          changed=false
          if [ "$EVENT" = workflow_dispatch ]; then
            changed=true
          else
            previous="$(git show "$BEFORE:apps/desktop/src-tauri/tauri.conf.json" | jq -er '.version')"
            if [ "$version" != "$previous" ]; then
              changed=true
            fi
          fi
          if [ "$changed" = true ]; then
            package_version="$(jq -er .version apps/desktop/package.json)"
            cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)"
            if [ "$version" != "$package_version" ] || [ "$version" != "$cargo_version" ]; then
              echo "::error::Desktop version files do not match"
              exit 1
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid desktop version $version"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null &&
               [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already points to a different commit"
              exit 1
            fi
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (macOS)
    needs: prepare
    if: needs.prepare.outputs.bumped == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Select the release channel
        id: channel
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the desktop build
        uses: ./.github/actions/desktop-setup

      - name: Build Dray Island
        run: |
          brew install xcodegen
          apps/island/build.sh apps/desktop/src-tauri/target/island

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generateReleaseNotes: true
          args: --target universal-apple-darwin --features cef --config src-tauri/tauri.cef.conf.json --config src-tauri/tauri.island.conf.json

  publish:
    name: Publish
    needs: [prepare, build]
    if: needs.prepare.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  manifest:
    name: Update channels
    needs: [prepare, publish]
    if: needs.prepare.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Update channel manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json --output "$RUNNER_TEMP/latest.json"
          npm install --global semver
          git init "$RUNNER_TEMP/updates"
          cd "$RUNNER_TEMP/updates"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          if git fetch origin updates; then
            git checkout -b updates FETCH_HEAD
          else
            git checkout --orphan updates
          fi
          new="$(jq -er .version "$RUNNER_TEMP/latest.json")"
          promote() {
            current="$(jq -r '.version // empty' "$1" 2>/dev/null || true)"
            if [ -z "$current" ] || ! semver -p -r ">$new" "$current" >/dev/null; then
              cp "$RUNNER_TEMP/latest.json" "$1"
            fi
          }
          promote beta.json
          if [[ "$TAG" != *-* ]]; then
            promote stable.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update release channels" -m "Publish the manifests for $TAG."
            git push origin HEAD:updates
          fi
