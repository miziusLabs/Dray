name: CI

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/package.json
  workflow_dispatch:

permissions:
  contents: write

env:
  # Part of the cache key's environment, so it has to match warm-cache.yml.
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(jq -er '.version | strings | select(length > 0)' apps/desktop/src-tauri/tauri.conf.json)"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          changed=false
          if [ "$EVENT" = workflow_dispatch ]; then
            changed=true
          else
            previous="$(git show "$BEFORE:apps/desktop/src-tauri/tauri.conf.json" | jq -er '.version')"
            if [ "$version" != "$previous" ]; then
              changed=true
            fi
          fi
          if [ "$changed" = true ]; then
            package_version="$(jq -er .version apps/desktop/package.json)"
            cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)"
            if [ "$version" != "$package_version" ] || [ "$version" != "$cargo_version" ]; then
              echo "::error::Desktop version files do not match"
              exit 1
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid desktop version $version"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null &&
               [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already points to a different commit"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  notary-check:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - run: xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" >/dev/null
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build:
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    needs: [version, notary-check]
    runs-on: macos-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      dmg: ${{ steps.mirror.outputs.dmg }}
    steps:
      - uses: actions/checkout@v4

      - id: channel
        run: |
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The release notes are read from CHANGELOG.md rather than written a
      # second time here. GitHub appends its generated commit list underneath,
      # so the hand-written part stays a summary and the file stays the source.
      #
      # A heading carries a date and a notify mark after the version, and
      # media paths are relative to the file, so both are rewritten for GitHub.
      - id: notes
        run: |
          V="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          BODY="$(awk -v want="## $V" '
            $0 == want || index($0, want " ·") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' apps/desktop/CHANGELOG.md)"
          BODY="$(printf '%s\n' "$BODY" | sed 's#](changelog/#](https://www.drayhq.com/changelog/#g')"

          # A stable release with no section would publish notes saying nothing,
          # which is worth stopping for — same reason the version guard above
          # is fatal. A prerelease is allowed to ship without one.
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            if [ "${{ steps.channel.outputs.channel }}" = "stable" ]; then
              echo "apps/desktop/CHANGELOG.md has no '## $V' section" >&2
              exit 1
            fi
            BODY=""
          fi

          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Restores the cache warm-cache.yml wrote on `main`; see the action for
      # why the two share it.
      - uses: ./.github/actions/desktop-setup

      # The helper apps are signed by cef-helpers.sh, which the cef overlay
      # runs as `beforeBundleCommand` — after the CLI's own cargo build, before
      # its bundler — with the same identity the bundler puts on the app around
      # them. `bundle.macOS.files` copies and signs nothing, and codesign
      # refuses an app whose nested bundles carry no signature. Their
      # entitlements differ from the app's too — V8 in the renderer wants JIT —
      # so a `--deep` sign would be the wrong shape even if the bundler offered
      # one. The bundler imports the certificate only once it starts signing,
      # which is after the hook, so it is imported here first.
      #
      # It used to run as its own step ahead of the action, with a cargo build
      # of its own. See the script for why that compiled the tree twice.
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Dray Island, the Swift panel shipped inside the bundle. Built and signed
      # ahead of the bundler for the helpers' reason above.
      - name: Build Dray Island
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          brew install xcodegen
          apps/island/build.sh apps/desktop/src-tauri/target/island

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundle. Separate from Apple's signature and not
          # optional: without it the client refuses the download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple's, which is what stops macOS blocking the download outright.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # PostHog's write-only project key, read by `option_env!` at compile
          # time. Unset is not fatal — the build ships with analytics inert,
          # which is also what a local build does. `POSTHOG_HOST` is only needed
          # if the project moves off US cloud; unset takes the default.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        with:
          # The Tauri project no longer sits at the repo root.
          projectPath: apps/desktop
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: ${{ needs.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: true
          # One bundle for both architectures. The action expands the universal
          # entry into per-arch keys in `latest.json`, so a client asking for
          # `darwin-aarch64` finds it. `cef` turns the browser on, and the
          # overlay config puts the helper apps in Contents/Frameworks; the
          # island one puts Dray Island in Contents/Helpers.
          args: --target universal-apple-darwin --features cef --config src-tauri/tauri.cef.conf.json --config src-tauri/tauri.island.conf.json

      # The bundler *warns* and carries on when notarization credentials are
      # missing or rejected — only an absent team id is fatal. So a release
      # that quietly shipped unnotarized looks exactly like one that worked,
      # until a user's Mac refuses to open it. `stapler validate` is what tells
      # the two apart: it fails unless a ticket is actually attached.
      - name: Verify the bundle is notarized
        run: |
          APP="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/$(jq -r .productName apps/desktop/src-tauri/tauri.conf.json).app"
          xcrun stapler validate "$APP"
          spctl --assess --verbose=2 --type exec "$APP"

      # The browser's half of the same question. The helpers have to be
      # there and signed with library validation off, or the downloaded
      # framework is refused at load; and the framework itself must *not*
      # be there, or the bundle just grew by 300MB and every update with it.
      - name: Verify the browser helpers
        run: |
          APP="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/$(jq -r .productName apps/desktop/src-tauri/tauri.conf.json).app"
          test ! -e "$APP/Contents/Frameworks/Chromium Embedded Framework.framework"
          for h in "" " (GPU)" " (Renderer)" " (Plugin)" " (Alerts)"; do
            HELPER="$APP/Contents/Frameworks/Dray Helper$h.app"
            codesign --verify --strict "$HELPER"
            codesign -d --entitlements - "$HELPER" 2>&1 | grep -q disable-library-validation
          done
          codesign -d --entitlements - "$APP" 2>&1 | grep -q disable-library-validation
          codesign --verify --strict "$APP/Contents/Helpers/Dray Island.app"

      # Downloads are served from R2, not the release: GitHub's asset CDN has
      # had whole afternoons of a 42MB dmg taking 45 minutes. Versioned keys
      # are immutable and back the updater manifest; the site's versionless
      # dmg is moved by the manifest job, behind its semver guard. A missing
      # secret fails the release rather than shipping a manifest whose URLs
      # point at nothing.
      - name: Mirror to R2
        id: mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 refuses the checksum headers newer CLIs send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?}" "${R2_ACCOUNT_ID:?}" "${R2_BUCKET:?}"
          BUNDLE=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          put() {
            aws s3 cp "$1" "s3://${R2_BUCKET}/$2" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --cache-control "public, max-age=31536000, immutable"
          }
          DMG="$(ls "$BUNDLE"/dmg/*.dmg)"
          put "$DMG" "${RELEASE_TAG}/$(basename "$DMG")"
          # The bundler writes `Dray.app.tar.gz`; tauri-action renames it on
          # upload, and the manifest names the renamed one.
          put "$(ls "$BUNDLE"/macos/*.app.tar.gz)" "${RELEASE_TAG}/Dray_universal.app.tar.gz"
          echo "dmg=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

  # The manifests live on a branch rather than in the release, because
  # `/releases/latest/` skips prereleases — so beta would have no fixed URL.
  # GitHub Pages serves this branch; the artifact URLs inside are rewritten
  # onto the R2 mirror the build job uploaded to.
  manifest:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates
          fetch-depth: 1

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOADS_URL: ${{ vars.DOWNLOADS_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          DMG: ${{ needs.build.outputs.dmg }}
        run: |
          set -euo pipefail
          : "${DOWNLOADS_URL:?}" "${DMG:?}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern latest.json --output release.json --clobber

          # The signature covers the bytes, not the URL, so moving the host
          # changes nothing the client verifies.
          jq --arg from "https://github.com/${GITHUB_REPOSITORY}/releases/download/" \
             --arg to "${DOWNLOADS_URL%/}/" \
             '.platforms |= map_values(.url |= sub($from; $to))' \
             release.json > manifest.json
          rm release.json
          # A rewrite matching nothing is what a changed URL shape looks like.
          if jq -e '[.platforms[].url] | any(startswith("https://github.com/"))' manifest.json >/dev/null; then
            echo "manifest still points at GitHub" >&2
            exit 1
          fi

          # Writes the release over a channel manifest unless that would move
          # the channel *backwards*. A stable release still serves both
          # channels — someone on beta should be offered the newer stable — but
          # a beta line runs ahead of stable for its whole life, so a stable
          # hotfix shipped while one is open must not clobber it: existing beta
          # users would see nothing (the client never downgrades), and a fresh
          # beta opt-in could never reach the beta at all. An equal version
          # rewrites, so re-running a release republishes its own manifest; a
          # missing or unreadable manifest is written, never an error.
          #
          # node-semver's own comparison, prerelease rules included — the one
          # the updater plugin makes. Not `sort -V`, which puts 0.9.4-beta.2
          # *above* 0.9.4. `-p` lets a prerelease satisfy the range. Installed
          # up front so a registry failure fails the job rather than reading
          # as "not newer" and overwriting.
          npm install --global semver
          NEW="$(jq -r .version manifest.json)"
          promote() {
            cur="$(jq -r '.version // empty' "$1" 2>/dev/null || true)"
            if [ -n "$cur" ] && semver -p -r ">$NEW" "$cur" >/dev/null; then
              echo "keeping $1 at $cur — $NEW is older"
            else
              cp manifest.json "$1"
            fi
          }

          promote beta.json
          if [ "${{ needs.build.outputs.channel }}" = "stable" ]; then
            promote stable.json
          fi
          rm manifest.json

          # Pages would otherwise run these through Jekyll.
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # A release that moved no manifest — a re-tag older than every
          # channel — leaves nothing staged, and an empty commit would fail
          # the job over a push that had nothing to say.
          git diff --cached --quiet || {
            git commit -m "release ${RELEASE_TAG}"
            git push
          }

          # The site's download button follows stable.json, so the same guard
          # that keeps the manifest from moving backwards keeps it too — and
          # only after the push landed, since a push lost to a concurrent
          # release means this one did not win. A server-side copy of the key
          # the build job uploaded; nothing is re-sent.
          if [ "$(jq -r '.version // empty' stable.json 2>/dev/null)" = "$NEW" ]; then
            aws s3 cp "s3://${R2_BUCKET}/${RELEASE_TAG}/${DMG}" "s3://${R2_BUCKET}/Dray_universal.dmg" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --metadata-directive REPLACE \
              --content-type application/x-apple-diskimage \
              --cache-control "public, max-age=300"
          fi
