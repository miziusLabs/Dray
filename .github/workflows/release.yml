name: Release

# A tag is the whole trigger, and its shape picks the channel: `v0.3.0` is
# stable, `v0.3.0-beta.1` is beta. Semver's own prerelease rule is what makes
# that work end to end — the updater compares versions, and `0.3.0-beta.1` is
# older than `0.3.0`, so a beta user lands on the stable release when it ships.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      # The manifest's version is the app's, not the tag's — a tag that names a
      # version the conf doesn't carry publishes a manifest no client considers
      # newer, and the release silently reaches nobody. Fail loudly instead.
      - run: |
          V="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v$V" >&2
            exit 1
          fi

      - id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Restores only. The cache is written by warm-cache.yml on `main`, which
      # is the one scope a tag build can read from — saving here would write an
      # entry under this tag's own ref that nothing will ever read again.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-darwin
          save-if: "false"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundle. Separate from Apple's signature and not
          # optional: without it the client refuses the download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple's, which is what stops macOS blocking the download outright.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generateReleaseNotes: true
          # One bundle for both architectures. The action expands the universal
          # entry into per-arch keys in `latest.json`, so a client asking for
          # `darwin-aarch64` finds it.
          args: --target universal-apple-darwin

      # The bundler *warns* and carries on when notarization credentials are
      # missing or rejected — only an absent team id is fatal. So a release
      # that quietly shipped unnotarized looks exactly like one that worked,
      # until a user's Mac refuses to open it. `stapler validate` is what tells
      # the two apart: it fails unless a ticket is actually attached.
      - name: Verify the bundle is notarized
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/$(jq -r .productName src-tauri/tauri.conf.json).app"
          xcrun stapler validate "$APP"
          spctl --assess --verbose=2 --type exec "$APP"

  # The manifests live on a branch rather than in the release, because
  # `/releases/latest/` skips prereleases — so beta would have no fixed URL.
  # GitHub Pages serves this branch; the artifact URLs inside still point at
  # the release, which stays the CDN.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates
          fetch-depth: 1

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern latest.json --output manifest.json --clobber

          # A stable release serves both channels: someone on beta should still
          # be offered the newer stable build. A beta release moves beta alone.
          cp manifest.json beta.json
          if [ "${{ needs.build.outputs.channel }}" = "stable" ]; then
            cp manifest.json stable.json
          fi
          rm manifest.json

          # Pages would otherwise run these through Jekyll.
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release ${GITHUB_REF_NAME}"
          git push
